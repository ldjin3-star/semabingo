<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SEMA 빙고 관리자</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Pretendard, 'Noto Sans KR', sans-serif; }

body { background: #f3f4f6; color: #111827; min-height: 100vh; }

header {
  background: #c62828; color: white;
  padding: 16px; text-align: center;
  font-size: 22px; font-weight: bold;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}

.container { max-width: 900px; margin: auto; padding: 14px; }

/* ── Dashboard ── */
.dashboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}
.stat-card {
  background: white; border-radius: 14px; padding: 16px; text-align: center;
  box-shadow: 0 1px 4px rgba(0,0,0,.07); border: 1px solid #e5e7eb;
}
.stat-card .label { font-size: 12px; color: #6b7280; font-weight: 600; }
.stat-card .num { font-size: 32px; font-weight: 900; margin-top: 6px; color: #0f4c81; }
.stat-card .num.red   { color: #dc2626; }
.stat-card .num.green { color: #16a34a; }
.stat-card .num.gold  { color: #d97706; }

/* ── Card ── */
.card {
  background: white; border-radius: 16px; padding: 16px; margin-bottom: 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,.07); border: 1px solid #e5e7eb;
}
.card h3 { font-size: 13px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }

/* ── Buttons ── */
.btn {
  width: 100%; padding: 14px; border: none; border-radius: 12px;
  cursor: pointer; font-weight: 700; font-size: 16px; margin-bottom: 8px;
  transition: all .18s; -webkit-tap-highlight-color: transparent;
}
.btn:last-child { margin-bottom: 0; }
.btn:active { transform: scale(.97); }
.btn-start { background: #16a34a; color: white; }
.btn-start:hover { background: #15803d; }
.btn-started { background: #dcfce7; color: #16a34a; border: 2px solid #86efac; cursor: default; }
.btn-reset { background: #111827; color: white; }
.btn-reset:hover { background: #000; }
.btn-outline { background: white; color: #374151; border: 1.5px solid #e5e7eb; }
.btn-outline:hover { background: #f9fafb; }

/* ── Game start section ── */
.start-section {
  background: #eff6ff; border: 2px solid #93c5fd;
  border-radius: 14px; padding: 18px; margin-bottom: 14px; text-align: center;
}
.start-section h3 { font-size: 16px; font-weight: 700; color: #1d4ed8; margin-bottom: 6px; }
.start-section p  { font-size: 13px; color: #6b7280; line-height: 1.7; margin-bottom: 14px; }
.start-section.done { background: #dcfce7; border-color: #86efac; }
.start-section.done h3 { color: #16a34a; }

/* ── Word grid ── */
.words {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
.word-btn {
  width: 100%; min-height: 52px;
  display: flex; align-items: center; justify-content: center;
  text-align: center; line-height: 1.3; word-break: keep-all;
  background: #f3f4f6; border: 2px solid #e5e7eb;
  border-radius: 10px; padding: 8px; font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all .15s; color: #111827;
  -webkit-tap-highlight-color: transparent;
}
.word-btn:hover  { background: #fee2e2; border-color: #fca5a5; color: #dc2626; }
.word-btn:active { transform: scale(.96); }
.word-btn.called { background: #dc2626; color: white; border-color: #dc2626; }

/* ── Called list ── */
.called-list {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
}
.called-chip {
  background: #fee2e2; border: 1px solid #fca5a5;
  border-radius: 14px; padding: 4px 12px; font-size: 13px; color: #dc2626; font-weight: 600;
}
.called-chip:last-child {
  background: #dc2626; color: white;
  animation: popIn .25s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn { from{transform:scale(.7);opacity:0;} to{transform:scale(1);opacity:1;} }

/* ── Winners ── */
.winner-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 12px; margin-bottom: 8px;
  background: #fef3c7; border: 1px solid #fde68a;
  animation: slideIn .3s ease;
}
@keyframes slideIn { from{opacity:0;transform:translateX(-8px);} to{opacity:1;transform:translateX(0);} }
.winner-rank {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900; flex-shrink: 0;
}
.rank-1{background:#fbbf24;color:#fff;} .rank-2{background:#9ca3af;color:#fff;} .rank-3{background:#d97706;color:#fff;} .rank-n{background:#e5e7eb;color:#6b7280;}
.winner-name { flex: 1; font-weight: 700; font-size: 15px; }
.winner-lines { font-size: 13px; font-weight: 700; color: #d97706; }
.winner-time  { font-size: 11px; color: #9ca3af; }

/* ── Participant list ── */
.participant-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px;
}
.participant-item:last-child { border-bottom: none; }
.participant-name { font-weight: 600; }
.participant-bingo { font-size: 12px; font-weight: 700; color: #d97706; }

.empty-state { text-align: center; padding: 24px; color: #9ca3af; font-size: 14px; }
.empty-state .ei { font-size: 32px; display: block; margin-bottom: 8px; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
</style>
</head>
<body>

<header>👑 SEMA 빙고 관리자</header>

<div class="container">

  <!-- Stats -->
  <div class="dashboard">
    <div class="stat-card"><div class="label">👥 참가자 수</div><div class="num" id="participantCount">0</div></div>
    <div class="stat-card"><div class="label">💾 제출된 빙고판</div><div class="num" id="boardCount">0</div></div>
    <div class="stat-card"><div class="label">📢 호출 단어</div><div class="num red" id="calledCount">0</div></div>
    <div class="stat-card"><div class="label">🏆 빙고 달성자</div><div class="num green" id="winnerCount">0</div></div>
  </div>

  <!-- 게임 시작 -->
  <div class="start-section" id="startSection">
    <h3 id="startTitle">⏳ 대회 시작 전</h3>
    <p id="startDesc">참가자들이 빙고판을 작성 중입니다.<br>준비가 완료되면 아래 버튼을 눌러 대회를 시작하세요.<br><strong>시작 후에는 참가자가 빙고판을 수정할 수 없습니다.</strong></p>
    <button class="btn btn-start" id="startBtn" onclick="startGame()" style="max-width:320px;margin:0 auto;display:block;">
      🚀 대회 시작하기
    </button>
  </div>

  <!-- 단어 호출 -->
  <div class="card">
    <h3>📢 단어 호출</h3>
    <div id="callDisabled" style="background:#fef3c7;border-radius:10px;padding:10px;font-size:13px;color:#d97706;font-weight:600;margin-bottom:12px;">
      ⚠️ 대회를 시작한 후에 단어를 호출할 수 있습니다
    </div>
    <div id="wordGrid" class="words" style="pointer-events:none;opacity:.45;"></div>
    <div id="calledListWrap" style="margin-top:10px;display:none;">
      <div style="font-size:12px;color:#6b7280;margin-bottom:6px;">호출된 단어</div>
      <div class="called-list" id="calledList"></div>
    </div>
  </div>

  <!-- 빙고 달성 현황 -->
  <div class="card">
    <h3>🏆 빙고 달성 현황</h3>
    <div id="winnerList"><div class="empty-state"><span class="ei">🎯</span>아직 빙고 달성자가 없습니다</div></div>
  </div>

  <!-- 참가자 현황 -->
  <div class="card">
    <h3 style="display:flex;justify-content:space-between;align-items:center;">
      <span>👥 참가자 현황</span>
      <button class="btn btn-outline" onclick="" style="width:auto;padding:5px 12px;font-size:12px;margin:0;">🔄 새로고침</button>
    </h3>
    <div id="participantList"><div class="empty-state"><span class="ei">👤</span>참가자가 없습니다</div></div>
  </div>

  <!-- 대회 관리 -->
  <div class="card" style="border-color:#fca5a5;">
    <h3 style="color:#dc2626;">⚠️ 대회 관리</h3>
    <button id="resetBtn" class="btn btn-reset" onclick="resetAll()">🗑️ 전체 초기화</button>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, onSnapshot,
  collection, query, orderBy, getDocs, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAiwMpzyovfkh46P658mAF9As4oPpOXAhQ",
  authDomain: "sema-bingo.firebaseapp.com",
  projectId: "sema-bingo",
  storageBucket: "sema-bingo.firebasestorage.app",
  messagingSenderId: "836857439540",
  appId: "1:836857439540:web:c48adfcf50a54f00093161"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const words = [
  "과학기술인연금","적립형공제","목돈급여","과학기술인으뜸적금","복지서비스",
  "든든한파트너","가치공유","약속","자산관리","책임성",
  "과학기술투자","복지사각해소","회원복지강화","리스크관리","신뢰성효율성",
  "과학기술인공제회","대덕복지센터","세마인베스트먼트","사이언스빌리지","세마파트너스",
  "15만명","18조8천억원","8,442억원","5.10%","회원만족",
  "한국과학기술정보연구원","한국전자통신연구원","국방과학연구소","한국수력원자력","과학기술정보통신부",
  "주식","채권","부동산","인프라","기업",
  "폴바셋","샐러디","후토루","부타이","능라도"
];

let calledWords = [];
let gameStarted = false;
let boardsData  = {};  // {username: [25개 단어]}

/* ── 단어 버튼 생성 ── */
const wordGrid = document.getElementById("wordGrid");
words.forEach(word => {
  const btn = document.createElement("button");
  btn.className = "word-btn";
  btn.textContent = word;
  btn.onclick = async () => {
    if (!gameStarted) return;
    const ref  = doc(db, "game", "calledWords");
    const snap = await getDoc(ref);
    let arr = snap.exists() ? (snap.data().words || []) : [];
    arr = arr.includes(word) ? arr.filter(v => v !== word) : [...arr, word];
    await setDoc(ref, { words: arr });
  };
  wordGrid.appendChild(btn);
});

/* ── 게임 시작 ── */
window.startGame = async function () {
  if (!confirm("대회를 시작하시겠습니까?\n시작 후 참가자들은 빙고판을 수정할 수 없습니다.")) return;
  await setDoc(doc(db, "game", "status"), { started: true, startedAt: Date.now() });
  alert("🚀 대회가 시작되었습니다!");
};

/* ── 게임 상태 반영 ── */
function applyGameStatus(started) {
  gameStarted = started;
  const ss   = document.getElementById("startSection");
  const title = document.getElementById("startTitle");
  const desc  = document.getElementById("startDesc");
  const btn   = document.getElementById("startBtn");
  const cd    = document.getElementById("callDisabled");
  const wg    = document.getElementById("wordGrid");
  const clw   = document.getElementById("calledListWrap");

  if (started) {
    ss.className = "start-section done";
    title.textContent = "✅ 대회 진행 중";
    desc.textContent  = "대회가 시작되었습니다. 단어를 클릭하여 호출하세요.";
    btn.className = "btn btn-started";
    btn.textContent = "✅ 대회 진행 중";
    btn.onclick = null;
    cd.style.display = "none";
    wg.style.pointerEvents = "auto";
    wg.style.opacity = "1";
    clw.style.display = "block";
  } else {
    ss.className = "start-section";
    title.textContent = "⏳ 대회 시작 전";
    btn.className = "btn btn-start";
    btn.textContent = "🚀 대회 시작하기";
    btn.onclick = window.startGame;
    cd.style.display = "block";
    wg.style.pointerEvents = "none";
    wg.style.opacity = ".45";
    clw.style.display = "none";
  }
}

/* ── 빙고 계산 ── */
function getBingoLines() {
  const lines = [];
  for(let r=0;r<5;r++){const row=[];for(let c=0;c<5;c++)row.push(r*5+c);lines.push(row);}
  for(let c=0;c<5;c++){const col=[];for(let r=0;r<5;r++)col.push(r*5+c);lines.push(col);}
  lines.push([0,6,12,18,24]); lines.push([4,8,12,16,20]);
  return lines;
}
function countBingo(board) {
  if (!board || board.length < 25) return 0;
  return getBingoLines().filter(line => line.every(i => board[i] && calledWords.includes(board[i]))).length;
}

/* ── 참가자 목록 갱신 ── */
function updateAdminDisplay() {
  const pl = document.getElementById("participantList");
  
  // 핵심: 제출자 명단(participantsList)에 포함된 사람만 필터링
  const activeEntries = Object.entries(boardsData).filter(([name]) => 
    participantsList.includes(name)
  );

  if (activeEntries.length === 0) {
    pl.innerHTML = '<div class="empty-state">👤 제출된 빙고판이 없습니다</div>';
    return;
  }

  pl.innerHTML = activeEntries.map(([name, board]) => {
    const bl = countBingo(board);
    const isWinner = bl >= 3; // 3줄 이상 강조
    return `
      <div class="participant-item" style="${isWinner ? 'background: #fffbeb; border-left: 4px solid #fbbf24;' : ''}">
        <div style="flex: 1; display: flex; align-items: center; justify-content: space-between;">
          <div>
            <span class="participant-name">${isWinner ? '👑 ' : ''}${name}</span>
            <span class="participant-bingo">${bl > 0 ? bl + '줄' : '-'}</span>
          </div>
          <button class="btn-reset-sub" onclick="resetSubmission('${name}')">제출 취소</button>
        </div>
      </div>`;
  }).join('');
}

/* ── Firebase 리스너 ── */
// 호출된 단어
onSnapshot(doc(db, "game", "calledWords"), snap => {
  calledWords = snap.exists() ? (snap.data().words || []) : [];
  document.getElementById("calledCount").textContent = calledWords.length;

  document.querySelectorAll(".word-btn").forEach(btn => {
    btn.classList.toggle("called", calledWords.includes(btn.textContent));
  });

  // 호출 목록 칩
  const cl = document.getElementById("calledList");
  cl.innerHTML = calledWords.length
    ? calledWords.map(w => `<span class="called-chip">${w}</span>`).join('')
    : '<span style="font-size:12px;color:#9ca3af;">아직 없습니다</span>';

  renderParticipants();
});

// 게임 상태
onSnapshot(doc(db, "game", "status"), snap => {
  applyGameStatus(snap.exists() ? (snap.data().started || false) : false);
});

// 참가자 수
onSnapshot(collection(db, "participants"), snap => {
  document.getElementById("participantCount").textContent = snap.size;
});

let participantsList = []; // 제출자 명단 저장 변수 추가

// 1. 제출자 명단(participants) 감시 (추가)
onSnapshot(collection(db, "participants"), (snap) => {
  participantsList = snap.docs.map(doc => doc.id); 
  document.getElementById("participantCount").textContent = snap.size;
  updateAdminDisplay(); 
});

// 2. 빙고판 데이터 감시 (기존 코드 수정)
onSnapshot(collection(db, "boards"), (snap) => {
  boardsData = {};
  snap.forEach(doc => { boardsData[doc.id] = doc.data().board; });
  updateAdminDisplay(); 
});

// 우승자 현황
onSnapshot(query(collection(db, "winners"), orderBy("createdAt")), snap => {
  document.getElementById("winnerCount").textContent = snap.size;
  const wl = document.getElementById("winnerList");
  if (!snap.size) {
    wl.innerHTML = '<div class="empty-state"><span class="ei">🎯</span>아직 빙고 달성자가 없습니다</div>';
    return;
  }
  let rank = 1;
  wl.innerHTML = '';
  snap.forEach(d => {
    const data = d.data();
    const rankClass = rank===1?'rank-1':rank===2?'rank-2':rank===3?'rank-3':'rank-n';
    const time = data.createdAt
      ? new Date(data.createdAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})
      : '';
    wl.innerHTML += `
      <div class="winner-item">
        <div class="winner-rank ${rankClass}">${rank}</div>
        <div class="winner-name">${data.username}</div>
        <div class="winner-lines">🎉 ${data.bingoLines || '?'}줄</div>
        <div class="winner-time">${time}</div>
      </div>`;
    rank++;
  });
});

/* ── 전체 초기화 ── */
window.resetAll = async function () {
  if (!confirm("⚠️ 모든 데이터를 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다.")) return;

  const collections = ["participants", "boards", "winners"];
  for (const col of collections) {
    const docs = await getDocs(collection(db, col));
    for (const item of docs.docs) await deleteDoc(item.ref);
  }
  try { await deleteDoc(doc(db, "game", "calledWords")); } catch(e){}
  try { await deleteDoc(doc(db, "game", "status"));      } catch(e){}

  alert("✅ 초기화 완료");
};
</script>
</body>
</html>
