<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SEMA 빙고 관리자 (최종 수정본)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Pretendard, sans-serif; }
body { background: #f3f4f6; color: #111827; }
header { background: #c62828; color: white; padding: 16px; text-align: center; font-size: 22px; font-weight: bold; position: sticky; top: 0; z-index: 100; }
.container { max-width: 900px; margin: auto; padding: 14px; }
.dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat-card { background: white; border-radius: 14px; padding: 16px; text-align: center; border: 1px solid #e5e7eb; }
.stat-card .label { font-size: 12px; color: #6b7280; }
.stat-card .num { font-size: 32px; font-weight: 900; color: #0f4c81; }
.card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 14px; border: 1px solid #e5e7eb; }
.card h3 { font-size: 13px; font-weight: 700; color: #6b7280; margin-bottom: 14px; }
.btn { width: 100%; padding: 14px; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; }
.btn-start { background: #16a34a; color: white; }
.btn-reset { background: #111827; color: white; margin-top: 8px; }
.words { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.word-btn { width: 100%; min-height: 52px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 12px; cursor: pointer; background: #f3f4f6; }
.word-btn.called { background: #dc2626 !important; color: white !important; }
.winner-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; margin-bottom: 8px; background: #fef3c7; border: 1px solid #fde68a; animation: slideIn 0.3s ease-out; }
@keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
.rank-badge { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; background: #fbbf24; color: white; }
.participant-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
.btn-del { padding: 4px 8px; font-size: 11px; background: #fee2e2; color: #dc2626; border-radius: 6px; cursor: pointer; border: none; }
</style>
</head>
<body>
<header>👑 SEMA 빙고 관리자</header>
<div class="container">
  <div class="dashboard">
    <div class="stat-card"><div class="label">👥 참가자</div><div class="num" id="participantCount">0</div></div>
    <div class="stat-card"><div class="label">📢 호출 단어</div><div class="num" id="calledCount" style="color:#dc2626;">0</div></div>
    <div class="stat-card"><div class="label">🏆 3줄 달성자</div><div class="num" id="winnerCount" style="color:#16a34a;">0</div></div>
  </div>

  <div class="card" id="startSection">
    <button class="btn btn-start" id="startBtn">🚀 대회 시작하기</button>
  </div>

  <div class="card">
    <h3>📢 단어 호출</h3>
    <div id="wordGrid" class="words"></div>
  </div>

  <div class="card">
    <h3>🏆 빙고 달성 현황 (실시간 감지)</h3>
    <div id="winnerList"></div>
  </div>

  <div class="card">
    <h3>👥 전체 참가자 명단</h3>
    <div id="participantList"></div>
  </div>

  <button class="btn btn-reset" id="resetBtn">🗑️ 전체 데이터 초기화</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyAiwMpzyovfkh46P658mAF9As4oPpOXAhQ", authDomain: "sema-bingo.firebaseapp.com", projectId: "sema-bingo", storageBucket: "sema-bingo.firebasestorage.app", messagingSenderId: "836857439540", appId: "1:836857439540:web:c48adfcf50a54f00093161" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const words = ["과학기술인연금","적립형공제","목돈급여","과학기술인으뜸적금","복지서비스","든든한파트너","가치공유","약속","자산관리","책임성","과학기술투자","복지사각해소","회원복지강화","리스크관리","신뢰성효율성","과학기술인공제회","대덕복지센터","세마인베스트먼트","사이언스빌리지","세마파트너스","15만명","18조8천억원","8,442억원","5.10%","회원만족","한국과학기술정보연구원","한국전자통신연구원","국방과학연구소","한국수력원자력","과학기술정보통신부","주식","채권","부동산","인프라","기업","폴바셋","샐러디","후토루","부타이","능라도"];

let calledWords = [];
let gameStarted = false;
let boards = {};
let participants = [];

// UI 그리기
function updateUI() {
  const wList = document.getElementById("winnerList");
  const pList = document.getElementById("participantList");
  let wHtml = '';
  let pHtml = '';
  let wCount = 0;

  // 모든 참가자 대상 계산
  participants.forEach(name => {
    const board = boards[name];
    const lines = calculateLines(board);
    
    if (lines >= 3) {
      wCount++;
      wHtml += `<div class="winner-item"><div class="rank-badge">${wCount}</div><div style="flex:1;font-weight:700;">${name}</div><div style="color:#d97706;">🎊 ${lines}줄 빙고!</div></div>`;
    }
    
    pHtml += `<div class="participant-item"><div><strong>${name}</strong> <span style="font-size:12px;color:#d97706;">(${lines}줄)</span></div><button class="btn-del" onclick="delPart('${name}')">취소</button></div>`;
  });

  wList.innerHTML = wHtml || '<div style="text-align:center;padding:20px;color:#9ca3af;">3줄 달성자가 아직 없습니다</div>';
  pList.innerHTML = pHtml || '<div style="text-align:center;padding:20px;color:#9ca3af;">참가자가 없습니다</div>';
  document.getElementById("winnerCount").textContent = wCount;
  document.getElementById("participantCount").textContent = participants.length;
}

function calculateLines(board) {
  if (!board) return 0;
  const lines = [];
  for(let r=0;r<5;r++){let row=[];for(let c=0;c<5;c++)row.push(r*5+c);lines.push(row);}
  for(let c=0;c<5;c++){let col=[];for(let r=0;r<5;r++)col.push(r*5+c);lines.push(col);}
  lines.push([0,6,12,18,24]); lines.push([4,8,12,16,20]);
  return lines.filter(line => line.every(i => board[i] && calledWords.includes(board[i]))).length;
}

// 리스너
onSnapshot(doc(db, "game", "calledWords"), snap => {
  calledWords = snap.exists() ? snap.data().words : [];
  document.getElementById("calledCount").textContent = calledWords.length;
  renderWordGrid();
  updateUI();
});

onSnapshot(collection(db, "participants"), snap => {
  participants = snap.docs.map(d => d.id);
  updateUI();
});

onSnapshot(collection(db, "boards"), snap => {
  snap.forEach(d => { boards[d.id] = d.data().board; });
  updateUI();
});

onSnapshot(doc(db, "game", "status"), snap => {
  gameStarted = snap.exists() ? snap.data().started : false;
  const btn = document.getElementById("startBtn");
  btn.textContent = gameStarted ? "✅ 대회 진행 중" : "🚀 대회 시작하기";
  btn.style.opacity = gameStarted ? "0.6" : "1";
});

function renderWordGrid() {
  const grid = document.getElementById("wordGrid");
  grid.innerHTML = '';
  words.forEach(w => {
    const btn = document.createElement("button");
    btn.className = "word-btn" + (calledWords.includes(w) ? " called" : "");
    btn.textContent = w;
    btn.onclick = async () => {
      if (!gameStarted) return;
      let newWords = calledWords.includes(w) ? calledWords.filter(v => v !== w) : [...calledWords, w];
      await setDoc(doc(db, "game", "calledWords"), { words: newWords });
    };
    grid.appendChild(btn);
  });
}

window.delPart = async (name) => {
  if(confirm("취소하시겠습니까?")) {
    await deleteDoc(doc(db, "participants", name));
    await deleteDoc(doc(db, "winners", name)).catch(()=>{});
  }
};

document.getElementById("startBtn").onclick = async () => {
  await setDoc(doc(db, "game", "status"), { started: true });
};

document.getElementById("resetBtn").onclick = async () => {
  if(!confirm("모든 데이터를 초기화하시겠습니까?")) return;
  const cols = ["participants", "boards", "winners"];
  for (const c of cols) {
    const ds = await getDocs(collection(db, c));
    for (const d of ds.docs) await deleteDoc(d.ref);
  }
  await setDoc(doc(db, "game", "calledWords"), { words: [] });
  await setDoc(doc(db, "game", "status"), { started: false });
  alert("초기화 완료");
};
</script>
</body>
</html>
