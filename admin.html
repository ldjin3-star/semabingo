<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SEMA 빙고 관리자</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Pretendard, 'Noto Sans KR', sans-serif; }
body { background: #f3f4f6; color: #111827; min-height: 100vh; }
header { background: #c62828; color: white; padding: 16px; text-align: center; font-size: 22px; font-weight: bold; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
.container { max-width: 900px; margin: auto; padding: 14px; }
.dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat-card { background: white; border-radius: 14px; padding: 16px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.07); border: 1px solid #e5e7eb; }
.stat-card .label { font-size: 12px; color: #6b7280; font-weight: 600; }
.stat-card .num { font-size: 32px; font-weight: 900; margin-top: 6px; color: #0f4c81; }
.stat-card .num.red { color: #dc2626; }
.stat-card .num.green { color: #16a34a; }
.card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.07); border: 1px solid #e5e7eb; }
.card h3 { font-size: 13px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }
.btn { width: 100%; padding: 14px; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 16px; margin-bottom: 8px; transition: all .18s; }
.btn-start { background: #16a34a; color: white; }
.btn-started { background: #dcfce7; color: #16a34a; border: 2px solid #86efac; cursor: default; }
.btn-reset { background: #111827; color: white; }
.btn-outline { background: white; color: #374151; border: 1.5px solid #e5e7eb; }
.start-section { background: #eff6ff; border: 2px solid #93c5fd; border-radius: 14px; padding: 18px; margin-bottom: 14px; text-align: center; }
.start-section.done { background: #dcfce7; border-color: #86efac; }
.words { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.word-btn { width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: center; text-align: center; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; background: #f3f4f6; }
.word-btn.called { background: #dc2626 !important; color: white !important; border-color: #dc2626 !important; }
.called-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.called-chip { background: #fee2e2; border: 1px solid #fca5a5; border-radius: 14px; padding: 4px 12px; font-size: 13px; color: #dc2626; font-weight: 600; }
.winner-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; margin-bottom: 8px; background: #fef3c7; border: 1px solid #fde68a; }
.winner-rank { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; }
.rank-1{background:#fbbf24;color:#fff;} .rank-2{background:#9ca3af;color:#fff;} .rank-3{background:#d97706;color:#fff;} .rank-n{background:#e5e7eb;color:#6b7280;}
.participant-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
.btn-reset-sub { padding: 4px 8px; font-size: 11px; background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; border-radius: 6px; cursor: pointer; }
.empty-state { text-align: center; padding: 24px; color: #9ca3af; font-size: 14px; }
</style>
</head>
<body>

<header>👑 SEMA 빙고 관리자</header>

<div class="container">
  <div class="dashboard">
    <div class="stat-card"><div class="label">👥 참가자 수</div><div class="num" id="participantCount">0</div></div>
    <div class="stat-card"><div class="label">💾 제출된 빙고판</div><div class="num" id="boardCount">0</div></div>
    <div class="stat-card"><div class="label">📢 호출 단어</div><div class="num red" id="calledCount">0</div></div>
    <div class="stat-card"><div class="label">🏆 빙고 달성자</div><div class="num green" id="winnerCount">0</div></div>
  </div>

  <div class="start-section" id="startSection">
    <h3 id="startTitle">⏳ 대회 시작 전</h3>
    <p id="startDesc">준비가 완료되면 아래 버튼을 눌러 대회를 시작하세요.</p>
    <button class="btn btn-start" id="startBtn" onclick="startGame()">🚀 대회 시작하기</button>
  </div>

  <div class="card">
    <h3>📢 단어 호출</h3>
    <div id="callDisabled" style="background:#fef3c7; padding:10px; border-radius:10px; color:#d97706; font-size:13px; font-weight:600; margin-bottom:12px;">⚠️ 대회를 시작한 후에 단어를 호출할 수 있습니다</div>
    <div id="wordGrid" class="words" style="pointer-events:none; opacity:.45;"></div>
    <div id="calledListWrap" style="margin-top:10px; display:none;">
      <div style="font-size:12px; color:#6b7280; margin-bottom:6px;">호출된 단어</div>
      <div class="called-list" id="calledList"></div>
    </div>
  </div>

  <div class="card">
    <h3>🏆 빙고 달성 현황</h3>
    <div id="winnerList"><div class="empty-state">아직 달성자가 없습니다</div></div>
  </div>

  <div class="card">
    <h3>👥 참가자 현황</h3>
    <div id="participantList"><div class="empty-state">참가자가 없습니다</div></div>
  </div>

  <div class="card" style="border-color:#fca5a5;">
    <h3 style="color:#dc2626;">⚠️ 대회 관리</h3>
    <button class="btn btn-reset" onclick="resetAll()">🗑️ 전체 초기화</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, query, orderBy, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyAiwMpzyovfkh46P658mAF9As4oPpOXAhQ", authDomain: "sema-bingo.firebaseapp.com", projectId: "sema-bingo", storageBucket: "sema-bingo.firebasestorage.app", messagingSenderId: "836857439540", appId: "1:836857439540:web:c48adfcf50a54f00093161" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const words = ["과학기술인연금","적립형공제","목돈급여","과학기술인으뜸적금","복지서비스","든든한파트너","가치공유","약속","자산관리","책임성","과학기술투자","복지사각해소","회원복지강화","리스크관리","신뢰성효율성","과학기술인공제회","대덕복지센터","세마인베스트먼트","사이언스빌리지","세마파트너스","15만명","18조8천억원","8,442억원","5.10%","회원만족","한국과학기술정보연구원","한국전자통신연구원","국방과학연구소","한국수력원자력","과학기술정보통신부","주식","채권","부동산","인프라","기업","폴바셋","샐러디","후토루","부타이","능라도"];

let calledWords = [];
let gameStarted = false;
let boardsData = {};
let participantsList = [];

/* ── 단어 그리드 생성 ── */
const wordGrid = document.getElementById("wordGrid");
words.forEach(word => {
  const btn = document.createElement("button");
  btn.className = "word-btn";
  btn.textContent = word;
  btn.onclick = async () => {
    if (!gameStarted) return;
    const ref = doc(db, "game", "calledWords");
    const snap = await getDoc(ref);
    let arr = snap.exists() ? (snap.data().words || []) : [];
    arr = arr.includes(word) ? arr.filter(v => v !== word) : [...arr, word];
    await setDoc(ref, { words: arr });
  };
  wordGrid.appendChild(btn);
});

window.startGame = async function () {
  if (!confirm("대회를 시작하시겠습니까?")) return;
  await setDoc(doc(db, "game", "status"), { started: true, startedAt: Date.now() });
};

function applyGameStatus(started) {
  gameStarted = started;
  const ss = document.getElementById("startSection");
  const wg = document.getElementById("wordGrid");
  const cd = document.getElementById("callDisabled");
  const clw = document.getElementById("calledListWrap");
  const btn = document.getElementById("startBtn");

  if (started) {
    ss.className = "start-section done";
    document.getElementById("startTitle").textContent = "✅ 대회 진행 중";
    btn.className = "btn btn-started"; btn.textContent = "✅ 대회 진행 중"; btn.onclick = null;
    cd.style.display = "none"; wg.style.pointerEvents = "auto"; wg.style.opacity = "1"; clw.style.display = "block";
  } else {
    ss.className = "start-section";
    document.getElementById("startTitle").textContent = "⏳ 대회 시작 전";
    btn.className = "btn btn-start"; btn.textContent = "🚀 대회 시작하기"; btn.onclick = window.startGame;
    cd.style.display = "block"; wg.style.pointerEvents = "none"; wg.style.opacity = ".45"; clw.style.display = "none";
  }
}

function countBingo(board) {
  if (!board || board.length < 25) return 0;
  const lines = [];
  for(let r=0; r<5; r++){ const row=[]; for(let c=0; c<5; c++) row.push(r*5+c); lines.push(row); }
  for(let c=0; c<5; c++){ const col=[]; for(let r=0; r<5; r++) col.push(r*5+c); lines.push(col); }
  lines.push([0,6,12,18,24]); lines.push([4,8,12,16,20]);
  return lines.filter(line => line.every(i => board[i] && calledWords.includes(board[i]))).length;
}

function updateAdminDisplay() {
  const pl = document.getElementById("participantList");
  const activeEntries = Object.entries(boardsData).filter(([name]) => participantsList.includes(name));
  document.getElementById("boardCount").textContent = activeEntries.length;
  
  if (activeEntries.length === 0) { pl.innerHTML = '<div class="empty-state">제출된 빙고판이 없습니다</div>'; return; }
  pl.innerHTML = activeEntries.map(([name, board]) => {
    const bl = countBingo(board);
    return `<div class="participant-item"><div><span style="font-weight:600;">${bl >= 3 ? '👑 ' : ''}${name}</span> <span style="color:#d97706; font-size:12px;">${bl}줄</span></div><button class="btn-reset-sub" onclick="resetSubmission('${name}')">제출 취소</button></div>`;
  }).join('');
}

/* ── 실시간 리스너 ── */
onSnapshot(doc(db, "game", "calledWords"), snap => {
  calledWords = snap.exists() ? (snap.data().words || []) : [];
  document.getElementById("calledCount").textContent = calledWords.length;
  document.querySelectorAll(".word-btn").forEach(btn => btn.classList.toggle("called", calledWords.includes(btn.textContent)));
  const cl = document.getElementById("calledList");
  cl.innerHTML = calledWords.length ? calledWords.map(w => `<span class="called-chip">${w}</span>`).join('') : '<span style="font-size:12px;color:#9ca3af;">아직 없습니다</span>';
  updateAdminDisplay();
});

onSnapshot(doc(db, "game", "status"), snap => applyGameStatus(snap.exists() ? (snap.data().started || false) : false));

onSnapshot(collection(db, "participants"), snap => {
  participantsList = snap.docs.map(doc => doc.id);
  document.getElementById("participantCount").textContent = snap.size;
  updateAdminDisplay();
});

onSnapshot(collection(db, "boards"), snap => {
  boardsData = {};
  snap.forEach(doc => { boardsData[doc.id] = doc.data().board; });
  updateAdminDisplay();
});

/* ── [핵심] 빙고 달성 현황 실시간 리스트 ── */
onSnapshot(query(collection(db, "winners"), orderBy("createdAt", "asc")), snap => {
  const wl = document.getElementById("winnerList");
  const winnerCountEl = document.getElementById("winnerCount");
  
  let html = '';
  let validCount = 0;
  let rank = 1;

  snap.forEach(d => {
    const data = d.data();
    // 현재 참가자 명단에 있는 사람만 리스트에 추가
    if (participantsList.includes(data.username)) {
      validCount++;
      const rankClass = rank <= 3 ? `rank-${rank}` : 'rank-n';
      const time = data.createdAt ? new Date(data.createdAt).toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', second:'2-digit'}) : '';
      
      html += `
        <div class="winner-item">
          <div class="winner-rank ${rankClass}">${rank}</div>
          <div style="flex:1; font-weight:700;">${data.username}</div>
          <div style="color:#d97706; font-size:13px; font-weight:700;">🎉 ${data.bingoLines}줄</div>
          <div style="font-size:11px; color:#9ca3af; margin-left:8px;">${time}</div>
        </div>`;
      rank++;
    }
  });

  wl.innerHTML = html || '<div class="empty-state">아직 달성자가 없습니다</div>';
  winnerCountEl.textContent = validCount;
});

window.resetSubmission = async function(username) {
  if (!confirm(`"${username}"님의 제출을 취소하시겠습니까?`)) return;
  await deleteDoc(doc(db, "participants", username));
  try { await deleteDoc(doc(db, "winners", username)); } catch(e){}
};

window.resetAll = async function () {
  if (!confirm("모든 데이터를 초기화하시겠습니까?")) return;
  const cols = ["participants", "boards", "winners"];
  for (const c of cols) {
    const ds = await getDocs(collection(db, c));
    for (const d of ds.docs) await deleteDoc(d.ref);
  }
  await deleteDoc(doc(db, "game", "calledWords"));
  await deleteDoc(doc(db, "game", "status"));
  alert("초기화 완료");
};
</script>
</body>
</html>
