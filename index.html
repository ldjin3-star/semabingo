<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
/* 기존 스타일과 동일하되 시인성 개선 */
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Pretendard, sans-serif; }
body { background: #f3f4f6; color: #111827; }
header { background: #0f4c81; color: white; padding: 16px; text-align: center; font-weight: bold; }
.container { max-width: 600px; margin: auto; padding: 14px; }
.card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 14px; border: 1px solid #e5e7eb; }
.name-input { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid #e5e7eb; margin-bottom: 10px; font-size: 16px; }
.btn { width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; margin-bottom: 6px; }
.btn-blue { background: #0f4c81; color: white; }
.btn-red { background: #dc2626; color: white; }
.bingo-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.cell { aspect-ratio: 1; background: #f3f4f6; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: 600; cursor: pointer; border: 2px solid #d1d5db; }
.cell.selected { background: #fee2e2; border-color: #fca5a5; color: #dc2626; }
.cell.bingo-line { background: #fef3c7 !important; border-color: #fbbf24 !important; color: #d97706 !important; }
.words { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.word-btn { min-height: 48px; border-radius: 10px; border: 1px solid #e5e7eb; font-weight: 600; cursor: pointer; }
.word-btn.used { opacity: 0.3; pointer-events: none; }
</style>
</head>
<body>
<header>🎯 SEMA 빙고대회</header>
<div class="container">
  <div class="card">
    <input type="text" class="name-input" id="username" placeholder="이름을 입력하세요" />
    <button class="btn btn-blue" onclick="loadBoard()">📂 불러오기 / 참여확인</button>
    <button class="btn btn-red" id="submitBtn" onclick="submitBingo()">📨 참가 제출</button>
  </div>
  <div class="card">
    <div style="text-align:center; font-weight:800; margin-bottom:10px; color:#0f4c81;" id="bingoStatus">0 빙고</div>
    <div class="bingo-board" id="board"></div>
  </div>
  <div class="card" id="wordListSection">
    <button class="btn btn-blue" style="background:#16a34a;" onclick="randomBoard()">🎲 랜덤 생성</button>
    <div class="words" id="wordList"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyAiwMpzyovfkh46P658mAF9As4oPpOXAhQ", authDomain: "sema-bingo.firebaseapp.com", projectId: "sema-bingo", storageBucket: "sema-bingo.firebasestorage.app", messagingSenderId: "836857439540", appId: "1:836857439540:web:c48adfcf50a54f00093161" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const words = ["과학기술인연금","적립형공제","목돈급여","과학기술인으뜸적금","복지서비스","든든한파트너","가치공유","약속","자산관리","책임성","과학기술투자","복지사각해소","회원복지강화","리스크관리","신뢰성효율성","과학기술인공제회","대덕복지센터","세마인베스트먼트","사이언스빌리지","세마파트너스","15만명","18조8천억원","8,442억원","5.10%","회원만족","한국과학기술정보연구원","한국전자통신연구원","국방과학연구소","한국수력원자력","과학기술정보통신부","주식","채권","부동산","인프라","기업","폴바셋","샐러디","후토루","부타이","능라도"];

let selected = Array(25).fill(null);
let called = [];
let gameStarted = false;
let submitted = false;

// 초기화
const boardEl = document.getElementById("board");
for(let i=0; i<25; i++){
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.onclick = () => {
    if(submitted || gameStarted) return;
    // 단어 선택 로직 (생략 - 랜덤 사용 권장)
  };
  boardEl.appendChild(cell);
}

window.randomBoard = () => {
  selected = [...words].sort(()=>Math.random()-0.5).slice(0, 25);
  renderBoard();
};

function renderBoard() {
  const cells = document.querySelectorAll(".cell");
  selected.forEach((w, i) => {
    cells[i].textContent = w || "";
    cells[i].classList.toggle("selected", !!(w && called.includes(w)));
  });
  checkBingo();
}

async function checkBingo() {
  const lines = [];
  for(let r=0;r<5;r++){let row=[];for(let c=0;c<5;c++)row.push(r*5+c);lines.push(row);}
  for(let c=0;c<5;c++){let col=[];for(let r=0;r<5;r++)col.push(r*5+c);lines.push(col);}
  lines.push([0,6,12,18,24]); lines.push([4,8,12,16,20]);

  let count = 0;
  const cells = document.querySelectorAll(".cell");
  cells.forEach(c => c.classList.remove("bingo-line"));

  lines.forEach(line => {
    if(line.every(i => selected[i] && called.includes(selected[i]))) {
      count++;
      line.forEach(i => cells[i].classList.add("bingo-line"));
    }
  });

  document.getElementById("bingoStatus").textContent = count + " 빙고";
  
  // 관리자에게 실시간 보고
  const name = document.getElementById("username").value.trim();
  if(submitted && count >= 3 && name) {
    await setDoc(doc(db, "winners", name), { username: name, bingoLines: count, createdAt: Date.now() }, { merge: true });
  }
}

window.loadBoard = async () => {
  const name = document.getElementById("username").value.trim();
  if(!name) return alert("이름을 입력하세요");
  const bSnap = await getDoc(doc(db, "boards", name));
  if(bSnap.exists()) {
    selected = bSnap.data().board;
    const pSnap = await getDoc(doc(db, "participants", name));
    if(pSnap.exists()) {
      submitted = true;
      document.getElementById("submitBtn").disabled = true;
      document.getElementById("submitBtn").textContent = "✅ 제출됨";
      document.getElementById("wordListSection").style.display = "none";
    }
    renderBoard();
    alert("데이터를 불러왔습니다.");
  }
};

window.submitBingo = async () => {
  const name = document.getElementById("username").value.trim();

  await setDoc(doc(db, "participants<!DOCTYPE html>

.bingo-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 10px; }
.cell { aspect-ratio: 1; background: #f3f4f6; border: 2px dashed #d1d5db; border-radius: 9px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: clamp(8px, 2.3vw, 11px); font-weight: 600; padding: 3px; line-height: 1.25; word-break: keep-all; cursor: pointer; transition: all .18s; position: relative; user-select: none; }
.cell.filled { background: white; border-style: solid; border-color: #d1d5db; }
.cell.selected { background: #fee2e2; border-color: #fca5a5; color: #dc2626; font-weight: 700; }
.cell.bingo-line { background: #fef3c7 !important; border-color: #fbbf24 !important; color: #d97706 !important; font-weight: 900 !important; box-shadow: 0 0 0 2px rgba(251,191,36,.4); }

.bingo-badge { background: #f3f4f6; border: 1.5px solid #e5e7eb; border-radius: 20px; padding: 5px 18px; font-size: 13px; color: #6b7280; font-weight: 700; }
.bingo-badge.on { background: #fef3c7; border-color: #fbbf24; color: #d97706; animation: badgePulse .8s infinite alternate; }
@keyframes badgePulse { from{box-shadow:none;} to{box-shadow:0 0 12px rgba(251,191,36,.5);} }

.words { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.word-btn { width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: center; text-align: center; background: #f3f4f6; border: 2px solid #e5e7eb; border-radius: 12px; padding: 10px 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all .15s; color: #111827; }
.word-btn.active { background: #0f4c81; color: white; border-color: #0f4c81; }
.word-btn.used { background: #f9fafb; color: #9ca3af; pointer-events: none; }

.bingo-overlay { display: none; position: fixed; inset: 0; z-index: 1000; align-items: center; justify-content: center; background: rgba(0,0,0,.55); backdrop-filter: blur(4px); }
.bingo-overlay.show { display: flex; }
.bingo-popup { background: white; border-radius: 22px; padding: 36px 28px; text-align: center; max-width: 310px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,.25); animation: popupIn .35s cubic-bezier(.34,1.56,.64,1); }
@keyframes popupIn { from{transform:scale(.6);opacity:0;} to{transform:scale(1);opacity:1;} }
</style>
</head>

};

onSnapshot(doc(db, "game", "calledWords"), snap => {
  called = snap.exists() ? snap.data().words : [];
