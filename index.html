<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SEMA 빙고대회</title>
<style>
/* CSS 스타일은 기존과 동일하므로 유지 (공간 절약을 위해 핵심 로직 위주로 확인하세요) */
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Pretendard, 'Noto Sans KR', sans-serif; }
body { background: #f3f4f6; color: #111827; min-height: 100vh; }
header { background: #0f4c81; color: white; padding: 16px; text-align: center; font-size: 22px; font-weight: bold; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
#gameBanner { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; font-size: 13px; font-weight: 700; border-bottom: 1px solid #e5e7eb; }
#gameBanner.waiting { background: #fef3c7; color: #d97706; }
#gameBanner.started { background: #dcfce7; color: #16a34a; }
.container { max-width: 600px; margin: auto; padding: 14px; }
.info { display: flex; gap: 10px; margin-bottom: 14px; }
.info-box { flex: 1; background: white; padding: 14px; border-radius: 14px; text-align: center; font-weight: 700; font-size: 13px; border: 1px solid #e5e7eb; }
.info-box span { display: block; font-size: 24px; font-weight: 900; color: #0f4c81; margin-top: 4px; }
.card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 14px; border: 1px solid #e5e7eb; }
.name-input { width: 100%; padding: 13px; border-radius: 10px; border: 1.5px solid #e5e7eb; font-size: 16px; margin-bottom: 10px; }
.btn { width: 100%; padding: 13px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; margin-bottom: 8px; }
.btn-green { background: #16a34a; color: white; }
.btn-blue { background: #0f4c81; color: white; }
.btn-red { background: #dc2626; color: white; }
.btn-gray { background: #f3f4f6; color: #374151; }
.bingo-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.cell { aspect-ratio: 1; background: #f3f4f6; border: 2px dashed #d1d5db; border-radius: 9px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: 600; cursor: pointer; position: relative; }
.cell.filled { background: white; border-style: solid; }
.cell.selected { background: #fee2e2; border-color: #fca5a5; color: #dc2626; font-weight: 700; }
.cell.bingo-line { background: #fef3c7 !important; border-color: #fbbf24 !important; color: #d97706 !important; font-weight: 900 !important; }
.bingo-badge { background: #f3f4f6; border-radius: 20px; padding: 5px 18px; font-size: 13px; color: #6b7280; font-weight: 700; border: 1.5px solid #e5e7eb; }
.bingo-badge.on { background: #fef3c7; border-color: #fbbf24; color: #d97706; }
.words { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.word-btn { min-height: 50px; background: #f3f4f6; border: 2px solid #e5e7eb; border-radius: 12px; font-weight: 600; cursor: pointer; }
.word-btn.active { background: #0f4c81; color: white; }
.word-btn.used { background: #f9fafb; color: #9ca3af; pointer-events: none; }
.bingo-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000; }
.bingo-overlay.show { display: flex; }
.bingo-popup { background: white; padding: 30px; border-radius: 20px; text-align: center; }
</style>
</head>
<body>

<div class="bingo-overlay" id="bingoOverlay">
  <div class="bingo-popup"><h2>🎉 BINGO!</h2><p id="bingoMsg"></p><button class="btn btn-blue" onclick="document.getElementById('bingoOverlay').classList.remove('show')">확인</button></div>
</div>

<header>🎯 SEMA 빙고대회</header>

<div id="gameBanner" class="waiting"><span id="bannerText">대기 중 — 관리자가 시작 전까지 빙고판을 수정하세요</span></div>

<div class="container">
  <div class="info">
    <div class="info-box">👥 참가자<span id="participantCount">0</span></div>
    <div class="info-box">📢 호출 단어<span id="calledCount">0</span></div>
  </div>

  <div class="card">
    <input type="text" class="name-input" id="username" placeholder="성함을 입력하세요" />
    <button class="btn btn-green" onclick="randomBoard()">🎲 랜덤 생성</button>
    <button class="btn btn-gray" onclick="loadBoard()">📂 불러오기</button>
    <button class="btn btn-blue" onclick="saveBoard()">💾 임시 저장</button>
    <button class="btn btn-red" id="submitBtn" onclick="submitBingo()">📨 참가 제출</button>
  </div>

  <div class="card">
    <div style="text-align:center; margin-bottom:10px;"><span class="bingo-badge" id="bingoBadge">0 빙고</span></div>
    <div class="bingo-board" id="board"></div>
  </div>

  <div class="card" id="wordCard">
    <h3>단어 선택 (<span id="selectedCount">0</span>/25)</h3>
    <div class="words" id="wordList"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyAiwMpzyovfkh46P658mAF9As4oPpOXAhQ", authDomain: "sema-bingo.firebaseapp.com", projectId: "sema-bingo", storageBucket: "sema-bingo.firebasestorage.app", messagingSenderId: "836857439540", appId: "1:836857439540:web:c48adfcf50a54f00093161" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const words = ["과학기술인연금","적립형공제","목돈급여","과학기술인으뜸적금","복지서비스","든든한파트너","가치공유","약속","자산관리","책임성","과학기술투자","복지사각해소","회원복지강화","리스크관리","신뢰성효율성","과학기술인공제회","대덕복지센터","세마인베스트먼트","사이언스빌리지","세마파트너스","15만명","18조8천억원","8,442억원","5.10%","회원만족","한국과학기술정보연구원","한국전자통신연구원","국방과학연구소","한국수력원자력","과학기술정보통신부","주식","채권","부동산","인프라","기업","폴바셋","샐러디","후토루","부타이","능라도"];

let selectedWords = Array(25).fill(null);
let calledWords = [];
let gameStarted = false;
let submitted = false;
let currentWord = null;
let prevBingo = 0;

// 셀 생성
const boardEl = document.getElementById("board");
for (let i=0; i<25; i++) {
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.onclick = () => {
    if (submitted || gameStarted) return;
    if (currentWord) {
      if (selectedWords.includes(currentWord)) return;
      selectedWords[i] = currentWord;
      cell.textContent = currentWord;
      cell.classList.add("filled");
      currentWord = null;
      renderWords();
    } else if (selectedWords[i]) {
      selectedWords[i] = null;
      cell.textContent = "";
      cell.classList.remove("filled");
      renderWords();
    }
  };
  boardEl.appendChild(cell);
}

function renderWords() {
  const list = document.getElementById("wordList");
  list.innerHTML = "";
  document.getElementById("selectedCount").textContent = selectedWords.filter(Boolean).length;
  words.forEach(w => {
    const btn = document.createElement("button");
    btn.className = "word-btn" + (selectedWords.includes(w) ? " used" : (currentWord===w ? " active" : ""));
    btn.textContent = w;
    btn.onclick = () => { if(!submitted && !gameStarted) { currentWord = w; renderWords(); }};
    list.appendChild(btn);
  });
}
renderWords();

window.randomBoard = () => {
  if (submitted || gameStarted) return;
  const shuffled = [...words].sort(() => Math.random() - 0.5).slice(0, 25);
  selectedWords = shuffled;
  document.querySelectorAll(".cell").forEach((c, i) => {
    c.textContent = shuffled[i];
    c.classList.add("filled");
  });
  renderWords();
};

window.saveBoard = async () => {
  const name = document.getElementById("username").value.trim();
  if (!name) return alert("이름을 입력하세요");
  await setDoc(doc(db, "boards", name), { username: name, board: selectedWords });
  alert("저장되었습니다");
};

window.loadBoard = async () => {
  const name = document.getElementById("username").value.trim();
  const snap = await getDoc(doc(db, "boards", name));
  if (!snap.exists()) return alert("저장된 데이터가 없습니다");
  selectedWords = snap.data().board;
  document.querySelectorAll(".cell").forEach((c, i) => {
    c.textContent = selectedWords[i] || "";
    c.classList.toggle("filled", !!selectedWords[i]);
  });
  const pSnap = await getDoc(doc(db, "participants", name));
  if (pSnap.exists()) { submitted = true; lockUI(); }
  renderWords();
  checkBingo();
};

window.submitBingo = async () => {
  const name = document.getElementById("username").value.trim();
  if (!name || selectedWords.filter(Boolean).length < 25) return alert("이름 입력 및 25칸을 채워주세요");
  if (!confirm("제출하시겠습니까? (수정 불가)")) return;
  await setDoc(doc(db, "participants", name), { username: name, createdAt: Date.now() });
  await setDoc(doc(db, "boards", name), { username: name, board: selectedWords });
  submitted = true;
  lockUI();
  alert("제출 완료!");
};

function lockUI() {
  document.getElementById("submitBtn").disabled = true;
  document.getElementById("submitBtn").textContent = "🔒 제출 완료";
  document.getElementById("wordCard").style.display = "none";
}

async function checkBingo() {
  const cells = document.querySelectorAll(".cell");
  cells.forEach(c => {
    const w = c.textContent;
    c.classList.toggle("selected", !!(w && calledWords.includes(w)));
    c.classList.remove("bingo-line");
  });

  const lines = [];
  for(let r=0; r<5; r++){const row=[]; for(let c=0; c<5; c++)row.push(r*5+c); lines.push(row);}
  for(let c=0; c<5; c++){const col=[]; for(let r=0; r<5; r++)col.push(r*5+c); lines.push(col);}
  lines.push([0,6,12,18,24]); lines.push([4,8,12,16,20]);

  let count = 0;
  lines.forEach(line => {
    if (line.every(i => cells[i].textContent && calledWords.includes(cells[i].textContent))) {
      count++;
      line.forEach(i => cells[i].classList.add("bingo-line"));
    }
  });

  const badge = document.getElementById("bingoBadge");
  badge.textContent = count + " 빙고";
  badge.classList.toggle("on", count >= 3);

  const name = document.getElementById("username").value.trim();
  if (submitted && gameStarted && count >= 3 && name) {
    await setDoc(doc(db, "winners", name), { username: name, bingoLines: count, createdAt: Date.now() }, { merge: true });
    if (count > prevBingo) {
      document.getElementById("bingoMsg").textContent = `${count}줄 빙고 완성! 축하합니다!`;
      document.getElementById("bingoOverlay").classList.add("show");
    }
  }
  prevBingo = count;
}

onSnapshot(doc(db, "game", "calledWords"), snap => {
  calledWords = snap.exists() ? snap.data().words : [];
  document.getElementById("calledCount").textContent = calledWords.length;
  checkBingo();
});

onSnapshot(doc(db, "game", "status"), snap => {
  gameStarted = snap.exists() ? snap.data().started : false;
  const b = document.getElementById("gameBanner");
  b.className = gameStarted ? "started" : "waiting";
  document.getElementById("bannerText").textContent = gameStarted ? "대회 진행 중!" : "대기 중...";
});

onSnapshot(collection(db, "participants"), snap => document.getElementById("participantCount").textContent = snap.size);
</script>
</body>
</html>
